  <div class="app">
    <header>
      <div>
        <h1>懸賞キャンペーン応募支援ダッシュボード</h1>
        <p class="lead">X・Instagram・Web上のキャンペーンを整理し、締切・条件・リスク・コメント案を手動応募向けに管理します。</p>
      </div>
      <div class="safe-note">自動ログイン、自動応募、SNS操作、Bot機能は実装していません。</div>

      <section class="view" id="view-reminders"></section>

      <section class="view" id="view-analytics"></section>
      <section class="view" id="view-backup"></section>

  </div>
  <div class="toast" id="toast"></div>
