<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>懸賞キャンペーン応募支援ダッシュボード</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>懸賞キャンペーン応募支援ダッシュボード</h1>
        <p class="lead">X・Instagram・Web上のキャンペーンを整理し、締切・条件・リスク・コメント案を手動応募向けに管理します。</p>
      </div>
      <div class="safe-note">自動ログイン、自動応募、SNS操作、Bot機能は実装していません。</div>
    </header>

    <nav class="tabs" id="tabs"></nav>

    <main>
      <section class="view active" id="view-today"></section>
      <section class="view" id="view-list"></section>
      <section class="view" id="view-new"></section>
      <section class="view" id="view-detail"></section>
      <section class="view" id="view-history"></section>
      <section class="view" id="view-comments"></section>
      <section class="view" id="view-analytics"></section>
      <section class="view" id="view-backup"></section>
    </main>
  </div>
  <div class="toast" id="toast"></div>

  <script src="js/app.js"></script>
  <script src="js/tags.js"></script>
  <script src="js/filter.js"></script>
  <script src="js/risk.js"></script>
  <script src="js/score.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/comments.js"></script>
  <script src="js/history.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/export.js"></script>
  <script src="js/sampleData.js"></script>
  <script src="js/baseUi.js"></script>
  <script src="js/formUi.js"></script>
  <script src="js/todayUi.js"></script>
  <script src="js/listUi.js"></script>
  <script src="js/detailUi.js"></script>
  <script src="js/historyUi.js"></script>
  <script src="js/commentsUi.js"></script>
  <script src="js/analyticsUi.js"></script>
  <script src="js/backupUi.js"></script>
  <script src="js/ui.js"></script>
  <script>
    window.Kensho.init();
  </script>
</body>
</html>
